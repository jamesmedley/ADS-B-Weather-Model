[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: fast isolated tests
    integration: multi-component tests using synthetic fixtures
    smoke: minimal end-to-end assurance
    slow: long-running; excluded from default run
filterwarnings =
    ignore::DeprecationWarning:wind_map\.preprocess
    ignore:.*torch\.cuda\.amp.*:FutureWarning
